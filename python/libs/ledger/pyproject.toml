[project]
name = "collicity-ledger"
version = "0.1.0"
description = "Price catalog, worst-case cost estimates and budget reservations (BUD-01–11)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "collicity-core",
    "collicity-db",
    "sqlalchemy>=2.0.36",
]

[tool.uv.sources]
collicity-core = { workspace = true }
collicity-db = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
