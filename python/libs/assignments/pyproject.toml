[project]
name = "collicity-assignments"
version = "0.1.0"
description = "Assignments, immutable versions, acceptance, step grants and the kill switch"
requires-python = ">=3.13,<3.14"
dependencies = [
    "collicity-core",
    "collicity-db",
    "collicity-grants",
    "sqlalchemy>=2.0.36",
]

[tool.uv.sources]
collicity-core = { workspace = true }
collicity-db = { workspace = true }
collicity-grants = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
