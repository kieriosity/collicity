[project]
name = "collicity-worker"
version = "0.1.0"
description = "The worker service: Temporal run segments, the outbox relay and sweepers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "collicity-core",
    "collicity-db",
    "collicity-runs",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "temporalio>=1.9",
]

[tool.uv.sources]
collicity-core = { workspace = true }
collicity-db = { workspace = true }
collicity-runs = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
