# Local development services. `just dev` starts them, creates the roles and migrates.
# LocalStack (S3, KMS, Lambda) and the fakes join as their work packages land.
name: collicity

services:
  postgres:
    # Aurora PostgreSQL 17 in AWS (technical design §2).
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  temporal:
    # Temporal Cloud over PrivateLink in AWS (technical design §2); the dev server locally.
    # Its state lives in the container (the image runs as a non-root user): it survives a stop
    # and resets on `docker compose down`. Run state is in Postgres either way.
    image: temporalio/temporal:1.8.0
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/tmp/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"  # gRPC
      - "127.0.0.1:8233:8233"  # web UI

volumes:
  pgdata:
