<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1264" viewBox="0 0 1344 1264" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect width="1344" height="1264" fill="#ffffff"/>
<text x="42" y="50" font-size="28" font-weight="600" fill="#151515" text-anchor="start">An approved write is checked, recorded, then executed</text>
<text x="42" y="86" font-size="20" font-weight="400" fill="#5b5b56" text-anchor="start">Nothing reaches the target until the approval is consumed and the audit intent is written</text>
<rect x="80" y="120" width="460" height="96" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="310" y="161.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Model drafts a proposal</text><text x="310" y="188.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">structured fields, each citing the snapshot</text><path d="M310,216 L310,256" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="310,256 304.7,246.4 315.3,246.4" fill="#b0b0a7"/><polygon points="310,256 510,336 310,416 110,336" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="310" y="330.2" font-size="20" font-weight="600" fill="#1b1b1b" text-anchor="middle">Deterministic</text><text x="310" y="356.2" font-size="20" font-weight="600" fill="#1b1b1b" text-anchor="middle">checks pass?</text><rect x="640" y="292" width="620" height="88" rx="14" ry="14" fill="#ffffff" stroke="#d64541" stroke-width="3"/><text x="950" y="329.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Invalid</text><text x="950" y="356.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">kept for forensics, never actionable</text><path d="M510,336 L638,336" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="638,336 628.4,341.3 628.4,330.7" fill="#b0b0a7"/><text x="578" y="324" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">no</text><text x="640" y="412" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="start">Checks: schema · cited text exists, matches and isn’t hidden-only ·</text><text x="640" y="436" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="start">grant pre-check · the target’s current value</text><path d="M310,416 L310,462" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="310,462 304.7,452.4 315.3,452.4" fill="#b0b0a7"/><text x="324" y="446" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="start">yes</text><rect x="80" y="464" width="460" height="116" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="310" y="489.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Approval request</text><text x="310" y="516.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">one hash binds the action, resource IDs,</text><text x="310" y="542.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">parameters, base versions and the</text><text x="310" y="568.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">compensation · expires in 7 days</text><rect x="640" y="478" width="620" height="88" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2" stroke-dasharray="7 6"/><text x="950" y="515.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Stale or expired</text><text x="950" y="542.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">re-presented with current values, never executed</text><path d="M540,522 L638,522" fill="none" stroke="#b0b0a7" stroke-width="2" stroke-dasharray="6 5"/><polygon points="638,522 628.4,527.3 628.4,516.7" fill="#b0b0a7"/><path d="M310,580 L310,622" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="310,622 304.7,612.4 315.3,612.4" fill="#b0b0a7"/><rect x="80" y="624" width="460" height="92" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="310" y="663.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">A person approves</text><text x="310" y="690.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">visibility, authority and passkey checks</text><path d="M310,716 L310,758" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="310,758 304.7,748.4 315.3,748.4" fill="#b0b0a7"/><rect x="80" y="760" width="460" height="172" rx="14" ry="14" fill="#e8f0fb" stroke="#2f6fdb" stroke-width="3"/><text x="310" y="798.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Gateway: one transaction</text><text x="310" y="825.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">consume a still-valid approval</text><text x="310" y="852.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">insert the effect (idempotency key)</text><text x="310" y="879.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">volume counter + n</text><text x="310" y="906.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">write the audit intent</text><rect x="640" y="802" width="620" height="88" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="950" y="839.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Only then is a token released</text><text x="950" y="866.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">the broker unwraps the user’s token for this call</text><path d="M540,846 L638,846" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="638,846 628.4,851.3 628.4,840.7" fill="#b0b0a7"/><path d="M310,932 L310,974" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="310,974 304.7,964.4 315.3,964.4" fill="#b0b0a7"/><rect x="80" y="976" width="460" height="112" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="310" y="1012.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Call by duplicate-prevention class</text><text x="310" y="1039.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">(a) idempotency key · (b) If-Match</text><text x="310" y="1065.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">(c) correlation ID · (d) none</text><rect x="640" y="988" width="620" height="88" rx="14" ry="14" fill="#ffffff" stroke="#d64541" stroke-width="3"/><text x="950" y="1025.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Paused: outcome unknown</text><text x="950" y="1052.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">class (d) only · repair item, never retried</text><path d="M540,1032 L638,1032" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="638,1032 628.4,1037.3 628.4,1026.7" fill="#b0b0a7"/><text x="554" y="1020" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="start">unknown</text><path d="M310,1088 L310,1130" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="310,1130 304.7,1120.4 315.3,1120.4" fill="#b0b0a7"/><rect x="80" y="1132" width="460" height="92" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="310" y="1171.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Audit result and effect outcome</text><text x="310" y="1198.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">with the target version read back</text>
</svg>