<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="718" viewBox="0 0 1344 718" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect width="1344" height="718" fill="#ffffff"/>
<text x="42" y="50" font-size="28" font-weight="600" fill="#151515" text-anchor="start">Runs live in Postgres; Temporal executes short segments between waits</text>
<text x="42" y="86" font-size="20" font-weight="400" fill="#5b5b56" text-anchor="start">No workflow stays alive across a human decision, a pause or a deploy</text>
<rect x="42" y="128" width="224" height="132" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="154" y="175.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Segment 1</text><text x="154" y="201.64" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">Running</text><text x="154" y="226.64" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">steps 1–3</text><path d="M266,194 L298,194" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="298,194 288.4,199.3 288.4,188.7" fill="#b0b0a7"/><rect x="300" y="128" width="224" height="132" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2" stroke-dasharray="7 6"/><text x="412" y="175.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Waiting: person</text><text x="412" y="201.64" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">approval requested</text><text x="412" y="226.64" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">no workflow alive</text><path d="M524,194 L556,194" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="556,194 546.4,199.3 546.4,188.7" fill="#b0b0a7"/><rect x="558" y="128" width="224" height="132" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="670" y="175.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Segment 2</text><text x="670" y="201.64" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">fresh token and</text><text x="670" y="226.64" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">new reservation</text><path d="M782,194 L814,194" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="814,194 804.4,199.3 804.4,188.7" fill="#b0b0a7"/><rect x="816" y="128" width="224" height="132" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2" stroke-dasharray="7 6"/><text x="928" y="175.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Paused: budget</text><text x="928" y="201.64" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">limit reached</text><text x="928" y="226.64" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">no workflow alive</text><path d="M1040,194 L1072,194" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="1072,194 1062.4,199.3 1062.4,188.7" fill="#b0b0a7"/><rect x="1074" y="128" width="224" height="132" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="1186" y="175.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Segment 3</text><text x="1186" y="201.64" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">Running</text><text x="1186" y="226.64" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">→ Succeeded</text><rect x="42" y="340" width="1260" height="104" rx="14" ry="14" fill="#e8f0fb" stroke="#2f6fdb" stroke-width="3"/><text x="672" y="385.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Postgres · the system of record</text><text x="672" y="412.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">run.state, state_version, continuation and outbox events change together in one transaction (transition())</text><path d="M412,260 L412,338" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="412,338 406.7,328.4 417.3,328.4" fill="#b0b0a7"/><text x="400" y="306" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="end">commit</text><path d="M928,260 L928,338" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="928,338 922.7,328.4 933.3,328.4" fill="#b0b0a7"/><text x="916" y="306" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="end">commit</text><path d="M670,340 L670,262" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="670,262 675.3,271.6 664.7,271.6" fill="#b0b0a7"/><text x="658" y="306" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="end">outbox starts n+1</text><path d="M1186,340 L1186,262" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="1186,262 1191.3,271.6 1180.7,271.6" fill="#b0b0a7"/><text x="1174" y="306" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="end">outbox starts n+1</text><rect x="42" y="500" width="620" height="178" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="352" y="541.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Sweeper · every 30 seconds</text><text x="352" y="568.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">approvals expire after 7 days</text><text x="352" y="595.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">reminders and escalation (ASG-10)</text><text x="352" y="622.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">pauses past 14 days take the cancel path</text><text x="352" y="649.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">unsettled reservations · outcome windows</text><rect x="682" y="500" width="620" height="178" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="992" y="541.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Kill switch (ASG-13)</text><text x="992" y="568.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">bump an epoch</text><text x="992" y="595.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">the gateway refuses new calls in seconds</text><text x="992" y="622.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">the live segment is cancelled</text><text x="992" y="649.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">no workflows to signal</text><path d="M352,500 L352,446" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="352,446 357.3,455.6 346.7,455.6" fill="#b0b0a7"/><path d="M992,500 L992,446" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="992,446 997.3,455.6 986.7,455.6" fill="#b0b0a7"/>
</svg>