xt-anchor="start">P0.3 Fakes with fault injection</text><rect x="445.52941176470586" y="261" width="80.29411764705883" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="533.8235294117646" y="278" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">B</text><text x="42" y="311" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P0.4 Ledger, model adapter</text><rect x="499.05882352941177" y="294" width="107.05882352941177" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="614.1176470588235" y="311" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">A</text><text x="42" y="344" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P0.5 Gateway, broker, audit</text><rect x="525.8235294117646" y="327" width="187.3529411764706" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="721.1764705882354" y="344" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">B</text><text x="42" y="377" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P0.6 extract + untrusted</text><rect x="445.52941176470586" y="360" width="107.05882352941177" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="560.5882352941177" y="377" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">C</text><text x="42" y="410" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P0.7 Run engine</text><rect x="579.3529411764706" y="393" width="160.58823529411765" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="747.9411764705883" y="410" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">A</text><text x="42" y="443" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P0.8 Web shell</text><rect x="552.5882352941177" y="426" width="133.8235294117647" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="694.4117647058824" y="443" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">C</text><text x="42" y="476" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P0.9 Gate 0 suites, red team</text><rect x="686.4117647058824" y="459" width="80.29411764705883" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="774.7058823529412" y="476" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">all</text><text x="42" y="509" font-size="18" font-weight="600" fill="#1b1b1b" text-anchor="start">Phase 1 · Enterprise beta</text><text x="42" y="542" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P1.1 Mail intake</text><rect x="766.7058823529412" y="525" width="187.3529411764706" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="962.0588235294118" y="542" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">B</text><text x="42" y="575" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P1.2 Queues, visibility, lineage</text><rect x="766.7058823529412" y="558" width="107.05882352941177" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="881.7647058823529" y="575" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">A+C</text><text x="42" y="608" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P1.3 Supervisor, router, inventory</text><rect x="873.7647058823529" y="591" width="133.8235294117647" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="1015.5882352941177" y="608" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">A</text><text x="42" y="641" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P1.4 Admin, budgets, Q&amp;A, builder</text><rect x="873.7647058823529" y="624" width="267.6470588235294" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="1149.4117647058824" y="641" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">C+A</text><text x="42" y="674" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P1.5 Evaluation and metrics</text><rect x="954.0588235294118" y="657" width="80.29411764705883" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><text x="1042.3529411764707" y="674" font-size="14" font-weight="400" fill="#5b5b56" text-anchor="start">B</text><text x="42" y="707" font-size="17" font-weight="400" fill="#1b1b1b" text-anchor="start">P1.6 Onboarding, then 8 weeks of use</text><rect x="1007.5882352941177" y="690" width="26.764705882352942" height="24" rx="6" ry="6" fill="#ecece6" stroke="#cbcbc3" stroke-width="1.5"/><rect x="1034.3529411764707" y="690" width="214.11764705882354" height="24" rx="6" ry="6" fill="#dce8fa" stroke="#2f6fdb" stroke-width="1.5"/><text x="1141.4117647058824" y="707" font-size="14" font-weight="400" fill="#1b1b1b" text-anchor="middle">design partners use it weekly</text><line x1="766.7058823529412" y1="150" x2="766.7058823529412" y2="725" stroke="#c8c8bf" stroke-width="2" stroke-dasharray="5 5"/><polygon points="766.7058823529412,729 777.7058823529412,740 766.7058823529412,751 755.7058823529412,740" fill="#c8c8bf"/><text x="766.7058823529412" y="775" font-size="17" font-weight="600" fill="#1b1b1b" text-anchor="middle">Gate 0</text><text x="766.7058823529412" y="797" font-size="16" font-weight="400" fill="#5b5b56" text-anchor="middle">week 14</text><line x1="1034.3529411764707" y1="150" x2="1034.3529411764707" y2="725" stroke="#c8c8bf" stroke-width="2" stroke-dasharray="5 5"/><polygon points="1034.3529411764707,729 1045.3529411764707,740 1034.3529411764707,751 1023.3529411764707,740" fill="#c8c8bf"/><text x="1034.3529411764707" y="775" font-size="17" font-weight="600" fill="#1b1b1b" text-anchor="middle">Partners live</text><text x="1034.352941