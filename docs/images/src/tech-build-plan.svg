<text x="42" y="50" font-size="28" font-weight="600" fill="#151515" text-anchor="start">A team of three reaches gate 0 in about 14 weeks and gate 1 in about 32</text>
<text x="42" y="86" font-size="20" font-weight="400" fill="#5b5b56" text-anchor="start">Indicative schedule by lane (A platform, B connectors and intake, C web); two engineers ≈ 1.4×, one ≈ 2.3×</text>
