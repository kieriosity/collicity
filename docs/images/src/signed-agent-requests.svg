<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="724" viewBox="0 0 1344 724" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect width="1344" height="724" fill="#ffffff"/>
<text x="42" y="50" font-size="28" font-weight="600" fill="#151515" text-anchor="start">Each request carries two identities: the agent’s and the user’s</text>
<text x="42" y="86" font-size="20" font-weight="400" fill="#5b5b56" text-anchor="start">The signature proves Collicity sent it; the user’s own token decides what it can reach</text>
<rect x="42" y="130" width="360" height="168" rx="14" ry="14" fill="#e8f0fb" stroke="#2f6fdb" stroke-width="3"/><text x="222" y="180.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Connector gateway</text><text x="222" y="207.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">signs as Collicity:</text><text x="222" y="234.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">Ed25519 · 60 s expiry · nonce</text><text x="222" y="261.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">and adds the user’s own token</text>
<path d="M402,214 L490,214" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="490,214 480.4,219.3 480.4,208.7" fill="#b0b0a7"/>
<rect x="492" y="130" width="360" height="168" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="672" y="180.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Target, or its CDN</text><text x="672" y="207.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">signature: it’s Collicity</text><text x="672" y="234.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">token: acting for this user</text><text x="672" y="261.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">its own rules decide</text>
<path d="M852,214 L940,214" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="940,214 930.4,219.3 930.4,208.7" fill="#b0b0a7"/><text x="896" y="202" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="middle">allowed</text>
<rect x="942" y="130" width="360" height="168" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="1122" y="194.35" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Request proceeds</text><text x="1122" y="221.12" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">within the user’s own access</text><text x="1122" y="248.12" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">and the site’s rules for agents</text>
<path d="M672,298 L672,386" fill="none" stroke="#b0b0a7" stroke-width="2" stroke-dasharray="6 5"/><polygon points="672,386 666.7,376.4 677.3,376.4" fill="#b0b0a7"/><text x="658" y="348" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="end">fetches and caches keys</text>
<path d="M222,298 L222,450 L490,450" fill="none" stroke="#b0b0a7" stroke-width="2" stroke-dasharray="6 5"/><polygon points="490,450 480.4,455.3 480.4,444.7" fill="#b0b0a7"/><text x="236" y="380" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="start">publishes public keys</text>
<rect x="492" y="388" width="360" height="124" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="672" y="430.35" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Key directory</text><text x="672" y="457.12" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">public keys at a well-known URL</text><text x="672" y="484.12" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">on Collicity’s own domain</text>
<path d="M852,270 L897,270 L897,463 L940,463" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="940,463 930.4,468.3 930.4,457.7" fill="#b0b0a7"/><text x="909" y="350" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="start">refused</text>
<rect x="942" y="388" width="360" height="150" rx="14" ry="14" fill="#ffffff" stroke="#d64541" stroke-width="3"/><text x="1122" y="429.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Refused or challenged</text><text x="1122" y="456.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">the step ends (CON-03), never</text><text x="1122" y="483.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">retried unsigned, as another</text><text x="1122" y="510.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">agent or by solving a challenge</text>
<path d="M110,298 L110,578" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="110,578 104.7,568.4 115.3,568.4" fill="#b0b0a7"/><text x="122" y="540" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="start">every call</text>
<path d="M1122,538 L1122,632 L854,632" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="854,632 863.6,626.7 863.6,637.3" fill="#b0b0a7"/><text x="1110" y="620" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="end">refusals are logged too</text>
<rect x="42" y="580" width="810" height="104" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="447" y="612.35" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Audit log</text><text x="447" y="639.12" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">the key ID and nonce of every signed request, so a report from</text><text x="447" y="666.12" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">a target’s operator traces back to its run, user and approval</text>
</svg>
