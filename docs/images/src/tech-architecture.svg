<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1104" viewBox="0 0 1344 1104" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect width="1344" height="1104" fill="#ffffff"/>
<text x="42" y="50" font-size="28" font-weight="600" fill="#151515" text-anchor="start">One gateway holds every credential and makes every external call</text>
<text x="42" y="86" font-size="20" font-weight="400" fill="#5b5b56" text-anchor="start">Beta on AWS: three services and a sandbox, each with its own IAM role, database role and network tier</text>
<rect x="42" y="122" width="440" height="100" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="262" y="165.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Temporal Cloud</text><text x="262" y="192.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">short run segments · IDs only</text><rect x="502" y="122" width="440" height="100" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="722" y="165.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Web client</text><text x="722" y="192.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">single-page app on CloudFront</text><rect x="42" y="270" width="440" height="168" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="262" y="306.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">worker</text><text x="262" y="333.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">ECS · subnet with no internet</text><text x="262" y="360.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">run segments, intake, outbox,</text><text x="262" y="387.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">notifier, audit sealer, sweepers</text><text x="262" y="414.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">no tokens · no model access</text><rect x="502" y="270" width="440" height="168" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="722" y="306.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">app</text><text x="722" y="333.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">ECS · ALB + WAF</text><text x="722" y="360.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">API, live updates, webhooks,</text><text x="722" y="387.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">admin console, Q&amp;A, builder</text><text x="722" y="414.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">reads only what each person may see</text><rect x="990" y="270" width="312" height="168" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="1146" y="347.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">WorkOS</text><text x="1146" y="374.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">SSO · SCIM directory sync</text><path d="M262,222 L262,268" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="262,268 256.7,258.4 267.3,258.4" fill="#b0b0a7"/><text x="276" y="252" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="start">PrivateLink</text><path d="M722,222 L722,268" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="722,268 716.7,258.4 727.3,258.4" fill="#b0b0a7"/><path d="M942,354 L988,354" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="988,354 978.4,359.3 978.4,348.7" fill="#b0b0a7"/><rect x="42" y="488" width="900" height="236" rx="16" ry="16" fill="#e8f0fb" stroke="#2f6fdb" stroke-width="3"/><text x="68" y="526" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="start">gateway · the only way out</text><text x="68" y="556" font-size="18" font-weight="400" fill="#5b5b56" text-anchor="start">sole holder of credentials and internet egress (Network Firewall allowlist)</text><rect x="64" y="576" width="200" height="128" rx="12" ry="12" fill="#f5f8fd" stroke="#c3d3ee" stroke-width="2"/><text x="164" y="623" font-size="20" font-weight="600" fill="#1b1b1b" text-anchor="middle">Grant evaluator</text><text x="164" y="646.66" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="middle">user ∩ consent ∩</text><text x="164" y="669.66" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="middle">grant ∩ admin</text><rect x="280" y="576" width="200" height="128" rx="12" ry="12" fill="#f5f8fd" stroke="#c3d3ee" stroke-width="2"/><text x="380" y="623" font-size="20" font-weight="600" fill="#1b1b1b" text-anchor="middle">Token broker</text><text x="380" y="646.66" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="middle">sealed per-user</text><text x="380" y="669.66" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="middle">tokens · CAE</text><rect x="496" y="576" width="200" height="128" rx="12" ry="12" fill="#f5f8fd" stroke="#c3d3ee" stroke-width="2"/><text x="596" y="623" font-size="20" font-weight="600" fill="#1b1b1b" text-anchor="middle">Model adapter</text><text x="596" y="646.66" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="middle">reservation first;</text><text x="596" y="669.66" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="middle">salted prompts</text><rect x="712" y="576" width="200" height="128" rx="12" ry="12" fill="#f5f8fd" stroke="#c3d3ee" stroke-width="2"/><text x="812" y="623" font-size="20" font-weight="600" fill="#1b1b1b" text-anchor="middle">Compute adapter</text><text x="812" y="646.66" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="middle">reserves, then</text><text x="812" y="669.66" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="middle">invokes extract</text><path d="M262,438 L262,486" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="262,486 256.7,476.4 267.3,476.4" fill="#b0b0a7"/><path d="M722,438 L722,486" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="722,486 716.7,476.4 727.3,476.4" fill="#b0b0a7"/><rect x="990" y="488" width="312" height="108" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="1146" y="535.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Target systems</text><text x="1146" y="562.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">Microsoft Graph, ticketing</text><rect x="990" y="616" width="312" height="108" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="1146" y="650.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Model providers</text><text x="1146" y="677.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">Claude Platform on AWS,</text><text x="1146" y="703.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">Bedrock (judge)</text><path d="M942,542 L988,542" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="988,542 978.4,547.3 978.4,536.7" fill="#b0b0a7"/><path d="M942,670 L988,670" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="988,670 978.4,675.3 978.4,664.7" fill="#b0b0a7"/><rect x="502" y="772" width="440" height="112" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="722" y="808.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">extract (Lambda)</text><text x="722" y="835.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">no network · untrusted mail and</text><text x="722" y="861.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">attachments → model view + flags</text><path d="M812,724 L812,770" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="812,770 806.7,760.4 817.3,760.4" fill="#b0b0a7"/><rect x="42" y="934" width="1260" height="128" rx="14" ry="14" fill="#ffffff" stroke="#cbcbc3" stroke-width="2"/><text x="672" y="976.85" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="middle">Data and audit</text><text x="672" y="1003.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">Aurora PostgreSQL: collicity (row-level security) · audit (insert-only, hash-chained) · vault (sealed tokens)</text><text x="672" y="1031.62" font-size="19" font-weight="400" fill="#5b5b56" text-anchor="middle">S3: snapshots, payloads, Object Lock anchors · KMS: one key per purpose, tenant in the encryption context</text><path d="M262,724 L262,932" fill="none" stroke="#b0b0a7" stroke-width="2"/><polygon points="262,932 256.7,922.4 267.3,922.4" fill="#b0b0a7"/><text x="278" y="834" font-size="17" font-weight="400" fill="#5b5b56" text-anchor="start">every call audited</text>
</svg>